
defaults:
  - dataset: maestro     # default dataset
  - adapter: tokenizer_cp  # default adapter
  - model: vae_clamp2_cp_tokenizer # default model
  - loss: cp_elbo         # default loss
  - _self_

# You can add any additional high-level settings or Hydra settings below
# For instance, setting up multi-run sweeps or general project parameters:
hydra:
  run:
    dir: outputs/hydra_train_repr/${now:%Y-%m-%d}/${now:%H-%M-%S}

competitor:
  batch_size: 1
  num_workers: 16
  train_split: 0.8
  max_encoder_learning_rate: 0.0003
  max_decoder_learning_rate: 0.0003
  encoder_weight_decay: 0.01
  decoder_weight_decay: 0.1

epochs: 1000  # number of epochs to train the model
seed: 42  # random seed for reproducibility
log_level: INFO  # possible values: DEBUG | INFO | WARNING | ERROR | CRITICAL
log_format: "[%(asctime)s] - [%(name)s] - [%(levelname)s] - %(message)s"
processing_precision: high  # possible values: medium | high
pretrained: true  # possible values: true | false, if true, the model will be loaded from the Hugging Face model hub (If it is available)
single_data_training: false # set if you want to train model only on single data (overtrain to check i model is able to regenerate this data)
grad_clip_val: 0.5  # gradient clipping value, set to null to disable gradient clipping
monitor_metric: "val_loss"  # metric to monitor for early stopping and model checkpointing
warmup_steps: 300  # number of warmup steps for learning rate scheduler (for single data training, set small value like 10/50)

vae_params:
  use_cache_generation: false  # whether to use cache during generation (inference) - requires more VRAM but speeds up generation
  strict_sampling: true  # whether to use strict sampling (top-k, top-p) during generation

wandb:
  project: "SymbolicRave"
  entity: "wut-zzsn"
  group: "first_stage"
  logs_dir: "./outputs/wandb_logs"

callbacks:
  output_dirpath: "outputs/checkpoints/train_repr/{unique_suffix}"
  model_checkpoint: true
  model_checkpoint_params:
    monitor: "val_loss"
    filename: "model-{epoch:02d}-{val_loss:.2f}"
  sampling: true
  sampling_params:
    sample_interval: 5
    num_samples: 1
    export_format: wav
  early_stopping: true
  early_stopping_params:
    patience: 20
    monitor: "val_loss"
  log_learning_rate: true
