name: mamba
params:
  # Determines the vector size for each token in the main backbone.
  # - Small size = extremely fast, low memory.
  # - Risk: May struggle to capture complex harmonies or rich textures.
  # STANDARD: 256, 512, or 768.
  hidden_size: 128

  # STATE SIZE (The "Compressed Memory")
  # The dimension of the internal recurrent state (d_state/N).
  # IMPACT: This is the fixed-size "RAM" Mamba carries forward.
  # - Larger = remembers more history details but increases compute cost slightly.
  # STANDARD: 16 is the Mamba default (works surprisingly well).
  state_size: 16

  # NETWORK DEPTH (Reasoning)
  # Number of Mamba layers stacked.
  # IMPACT: Mamba models often favor depth over width.
  # STANDARD: 32 is a very healthy depth (comparable to large LLaMA models). This provides strong structural modeling despite the small 'hidden_size'.
  num_decoder_layers: 32

  # EXPANSION FACTOR (Block Width)
  # Multiplier for the internal dimension inside the Mamba block (similar to FFN expansion).
  # IMPACT: If hidden_size=128 and expand=2, the inner calculation happens at dimension 256.
  # STANDARD: 2 (Mamba default). Transformers usually effectively use 4.
  expand: 2

  # CONVOLUTION KERNEL (Local Context)
  # Size of the 1D convolution applied before the State Space Model.
  # IMPACT: Helps the model smooth out local noise and capture immediate neighbors (e.g., this note vs. previous note) before the "long-term" memory kicks in.
  # STANDARD: 4.
  conv_kernel: 4

  # Whether to use class conditioning (e.g., genre, instrument type) in the decoder.
  class_conditioning: false