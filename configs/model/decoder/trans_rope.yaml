name: transformer_rope
params:
  # Determines the vector size for each token.
  # IMPACT: Higher values allow capturing complex harmonics and musical textures.
  # STANDARD: 768 or 1024. Must be divisible by 64.
  hidden_size: 768

  # Number of Transformer blocks.
  # IMPACT: Critical for modeling long-term structure (phrasing, repetition).
  # STANDARD: 1 is extremely shallow. Use 6-12+ for meaningful music generation.
  num_decoder_layers: 4

  # Probability of dropping neurons to prevent overfitting.
  # Argument used when doing token classification, for the hidden layer
  # STANDARD: 0.1.
  dropout: 0.1

  # Probability of dropping attention weights during training.
  # STANDARD: 0.
  attention_dropout: 0.1

  # The dropout ratio of (1) the word embeddings, (2) the post-attention hidden states, and (3) the post-mlp hidden states
  # STANDARD: 0.
  hidden_dropout: 0.1

  # [RoPE SPECIFIC] ROTATION PERCENTAGE
  # Defines what fraction of the hidden dimension gets the rotary embedding applied.
  # IMPACT:
  # - 1.0 (100%): Every dimension is rotated. Maximum relative positional information.
  # - 0.5 (50%): Only half the dimensions rotate (common in GPT-NeoX/GPT-J). Saves compute.
  # STANDARD: 1.0 (for LLaMA style) or 0.25-0.5 (for GPT-NeoX style).
  rotary_pct: 1

  # [RoPE SPECIFIC] BASE FREQUENCY
  # The base value for calculating the rotation frequencies (theta).
  # IMPACT: Controls the "resolution" of positions.
  # - 10,000: Standard for NLP (sequences up to ~4k-8k tokens).
  # - 500,000+: Used for very long contexts (e.g., CodeLlama) to prevent "frequency collision" at long distances.
  # STANDARD: 10,000 (Start here). Increase if your music sequences are extremely long (>8192 tokens).
  rotary_emb_base: 10_000

  # how to condition the decoder input on the latent representation: add | concatenation
  conditioning: add

  # whether to use custom implementation of the transformer decoder with additional Cross attention or use standard huggingface GPTNeoXModel implementation
  custom: false

  # whether to use cross-attention layers to condition the decoder on the latent representation (only for custom implementation)
  use_cross_attention: false