name: clamp2_trans_xl
latent_dim: 768
encoder:
  name: clamp2
  params:
    clamp2_vocab_size: 1
    hidden_size: 768  # multiplication of 64
    weights_url: "https://huggingface.co/sander-wood/clamp2/resolve/main/weights_clamp2_h_size_768_lr_5e-05_batch_128_scale_1_t_length_128_t_model_FacebookAI_xlm-roberta-base_t_dropout_True_m3_True.pth"
    num_hidden_layers: 12
decoder:
    name: transformer_xl
    params:
      # Determines the vector size for each token.
      # IMPACT: Defines how complex the musical relationships (harmony, key changes) the model can represent.
      # STANDARD: 768 or 1024. Must be divisible by the number of heads (64).
      hidden_size: 768

      # Number of Transformer blocks.
      # IMPACT: TransformerXL relies on depth for its recurrence mechanism to work well.
      # STANDARD: 4 is minimal. 6-12 is recommended for capturing long-term song structures.
      num_decoder_layers: 4

      # Specific to TransformerXL. Defines how many tokens from the *previous* batch/segment are cached and accessible via attention.
      # IMPACT: Crucial for music. It allows the model to "remember" the beat or theme from the previous measure even if it's outside the current input window.
      # STANDARD: Usually equal to or half of the training sequence length (e.g., 256 or 512).
      mem_len: 128

      # Probability of dropping neurons.
      # STANDARD: 0.1.
      dropout: 0.1
