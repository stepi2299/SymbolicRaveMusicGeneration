
# You can add any additional high-level settings or Hydra settings below
# For instance, setting up multi-run sweeps or general project parameters:
hydra:
  run:
    dir: outputs/hydra_generate/${now:%Y-%m-%d}/${now:%H-%M-%S}

log_level: INFO  # possible values: DEBUG | INFO | WARNING | ERROR | CRITICAL
processing_precision: medium  # possible values: medium | high
checkpoint_path: "outputs/checkpoints/train_repr/SequenceModel_simple_gpt_decoder_pop909_2026-03-30_18-26-33/model-epoch=95-val_loss=0.00.ckpt"
songs_to_generate: 10
generation_params:
  use_cache: true  # whether to use cache during generation (inference) - requires more VRAM but speeds up generation
  strict_sampling: false  # whether to use strict sampling (top-k, top-p) during generation
  temperature: 0.5  # sampling temperature
