name: elbo
params:
  turn: true  # whether to use annealing beta (increasing KL weight during training) or not
  annealing_steps: 10000  # number of steps to reach beta_max (for single data generation should be small like 100)
  beta_max: 0.1  # maximum KL weight
  kl_weight: 1.0  # weight of the KL divergence term if not using annealing