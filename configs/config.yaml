
defaults:
  - dataset: maestro     # default dataset
  - adapter: patchilizer  # default adapter
  - model: dummy_vae     # default model
  - competitor: dummy_competitor  # default competitor config
  - _self_

# You can add any additional high-level settings or Hydra settings below
# For instance, setting up multi-run sweeps or general project parameters:
hydra:
  run:
    dir: hydra_outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}

project_name: "Symbolic RAVE"
seed: 42
log_level: INFO
processing_precision: medium  # possible values: medium | high
