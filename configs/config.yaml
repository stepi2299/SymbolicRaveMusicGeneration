
defaults:
  - dataset: maestro     # default dataset
  - adapter: patchilizer  # default adapter
  - model: clamp2_vae     # default model
  - competitor: dummy_competitor  # default competitor config
  - _self_

# You can add any additional high-level settings or Hydra settings below
# For instance, setting up multi-run sweeps or general project parameters:
hydra:
  run:
    dir: outputs/hydra_outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}

seed: 42
log_level: INFO
processing_precision: medium  # possible values: medium | high
pretrained: true

wandb:
  project: "SymbolicRave"
  entity: "wut-zzsn"
  group: "first_stage"
  logs_dir: "outputs/wandb_logs"

callbacks:
  model_checkpoint: true
  model_checkpoint_params:
    monitor: "val_loss"
    dirpath: "outputs/checkpoints"
    filename: "vae-{epoch:02d}-{val_loss:.2f}"
  sampling: false
  sampling_params:
    sample_interval: 1
    num_samples: 2
  early_stopping: true
  early_stopping_params:
    patience: 5
