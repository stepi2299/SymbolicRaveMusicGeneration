name: tokenizer
params:
  tokenizer: remi  # remi | midilike | tsd, structured | octuple | mumidi | mmm
  training_model: BPE  # BPE | Unigram | WordPiece
  vocab_size: 20000
  sequence_length: 1024
  augmenter_params:
    augment_velocity: false
    augment_pitch: false
    velocity_interval: 6
    pitch_interval: 6
