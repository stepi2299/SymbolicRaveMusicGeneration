name: tokenizer
params:
  tokenizer: cpword  # remi | midilike | tsd, structured | cpword | octuple | mumidi | mmm
  training_model: BPE  # BPE | Unigram | WordPiece
  vocab_size: 20000
  sequence_length: 1024
  config:
    use_programs: false
    one_token_stream_for_programs: true
    special_tokens: ['PAD', 'BOS', "EOS", "MASK"]
  augmenter_params:
    augment_velocity: true
    augment_pitch: false
    velocity_interval: 3
    pitch_interval: 6

