
defaults:
  - dataset: maestro     # default dataset
  - adapter: tokenizer  # default adapter
  - model: vae_clamp2_trans_xl   # default model
  - loss: elbo         # default loss
  - _self_

# You can add any additional high-level settings or Hydra settings below
# For instance, setting up multi-run sweeps or general project parameters:
hydra:
  run:
    dir: outputs/hydra_train_repr/${now:%Y-%m-%d}/${now:%H-%M-%S}

competitor:
  batch_size: 1
  num_workers: 16
  train_split: 0.8
  max_encoder_learning_rate: 0.003
  max_decoder_learning_rate: 0.003

epochs: 1000  # number of epochs to train the model
seed: 42  # random seed for reproducibility
log_level: INFO  # possible values: DEBUG | INFO | WARNING | ERROR | CRITICAL
processing_precision: high  # possible values: medium | high
pretrained: true  # possible values: true | false, if true, the model will be loaded from the Hugging Face model hub (If it is available)
single_data_training: true # set if you want to train model only on single data (overtrain to check i model is able to regenerate this data)
grad_clip_val: 0.5  # gradient clipping value, set to null to disable gradient clipping
monitor_metric: "val_loss"  # metric to monitor for early stopping and model checkpointing
warmup_steps: 100  # number of warmup steps for learning rate scheduler (for single data training, set small value like 10/50)

wandb:
  project: "SymbolicRave"
  entity: "wut-zzsn"
  group: "first_stage"
  logs_dir: "./outputs/wandb_logs"

callbacks:
  output_dirpath: "outputs/checkpoints/train_repr/{unique_suffix}"
  model_checkpoint: true
  model_checkpoint_params:
    monitor: "val_loss"
    filename: "model-{epoch:02d}-{val_loss:.2f}"
  sampling: false
  sampling_params:
    sample_interval: 10
    num_samples: 1
    export_format: wav
  early_stopping: true
  early_stopping_params:
    patience: 10
    monitor: "val_loss"
  log_learning_rate: true
