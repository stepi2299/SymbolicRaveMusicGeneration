
defaults:
  - dataset: maestro     # default dataset
  - adapter: patchilizer  # default adapter
  - model: clamp2_vae     # default model
  - discriminator: dense  # default discriminator
  - _self_

# You can add any additional high-level settings or Hydra settings below
# For instance, setting up multi-run sweeps or general project parameters:
hydra:
  run:
    dir: outputs/hydra_train_decoder/${now:%Y-%m-%d}/${now:%H-%M-%S}


competitor:
  batch_size: 1
  num_workers: 16
  discriminator_learning_rate: 0.001
  decoder_learning_rate: 0.001

epochs: 100  # number of epochs to train the model
seed: 42  # random seed for reproducibility
log_level: INFO  # possible values: DEBUG | INFO | WARNING | ERROR | CRITICAL
processing_precision: medium  # possible values: medium | high
pretrained: false  # possible values: true | false, if true, the model will be loaded from the Hugging Face model hub (If it is available)
vae_weights_path: "outputs/checkpoints/train_repr/clamp2_vae_maestro_2025-05-08_18-02-29/model-epoch=01-val_loss=1.52.ckpt"

wandb:
  project: "SymbolicRave"
  entity: "wut-zzsn"
  group: "second_stage"
  logs_dir: "./outputs/wandb_logs"

callbacks:
  model_checkpoint: true
  output_dirpath: "outputs/checkpoints/train_decoder/{unique_suffix}"
  model_checkpoint_params:
    monitor: "train_discriminator_loss"
    filename: "finetuned_model-{epoch:02d}-{train_discriminator_loss:.2f}"
  sampling: true
  sampling_params:
    sample_interval: 1
    num_samples: 2
  early_stopping: true
  early_stopping_params:
    patience: 5
    monitor: "train_discriminator_loss"

