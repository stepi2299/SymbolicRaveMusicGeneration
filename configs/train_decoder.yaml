
defaults:
  - dataset: pop909     # default dataset, possible values: pop909, midicaps, maestro, midicaps_classes
  - adapter: compound_word  # default adapter, possible values: tokenizer, patchilizer, compound_word
  - discriminator: dense  # default discriminator, possible values: dense, clamp2
  - _self_

# You can add any additional high-level settings or Hydra settings below
# For instance, setting up multi-run sweeps or general project parameters:
hydra:
  run:
    dir: outputs/hydra_train_decoder/${now:%Y-%m-%d}/${now:%H-%M-%S}


competitor:
  batch_size: 1
  num_workers: 16
  discriminator_learning_rate: 0.0001
  generator_optimizer_params:
    max_decoder_learning_rate: 0.0003
    decoder_weight_decay: 0.1
  train_split: 0.8  # proportion of the dataset to use for training (the rest will be used for validation)
  train_augment: true # whether to apply data augmentation during training
  label_smoothing: 0.1  # label smoothing factor for discriminator training, set to 0 to disable label smoothing
  gan_loss_weight: 1.0  # weight for the GAN loss component in the overall loss function
  gumbel_tau: 1.0  # temperature parameter for Gumbel-Softmax, set to a higher value for softer samples and a lower value for harder samples
  warmup_steps: 100  # number of warmup steps for learning rate scheduler (for single data training, set small value like 10/50)
  monitor_metric: "val_loss"  # metric to monitor for early stopping and model checkpointing


epochs: 500  # number of epochs to train the model
seed: 42  # random seed for reproducibility
log_level: INFO  # possible values: DEBUG | INFO | WARNING | ERROR | CRITICAL
log_format: "[%(asctime)s] - [%(name)s] - [%(levelname)s] - %(message)s"
processing_precision: medium  # possible values: medium | high
pretrained: true  # possible values: true | false, if true, the model will be loaded from the Hugging Face model hub (If it is available)
main_model_weights_path: "outputs/checkpoints/train_repr/augm_no_cp_rope_pop/model-epoch=18-val_loss=1.19.ckpt"

wandb:
  project: "SymbolicRave"
  entity: "wut-zzsn"
  group: "second_stage"
  logs_dir: "./outputs/wandb_logs"

callbacks:
  model_checkpoint: true
  output_dirpath: "outputs/checkpoints/train_decoder/{unique_suffix}"
  model_checkpoint_params:
    monitor: "train_discriminator_loss"
    filename: "finetuned_model-{epoch:02d}-{train_discriminator_loss:.2f}"
  sampling: true
  sampling_params:
    sample_interval: 1
    num_samples: 2
  early_stopping: true
  early_stopping_params:
    patience: 5
    monitor: "train_discriminator_loss"
  log_learning_rate: true

