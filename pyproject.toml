[tool.poetry]
name = "Symbolic_rave"
version = "0.1.0"
description = ""
authors = ["stepi2299 <boenisch22@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
torch = "^2.5.1"
numpy = "^2.2.1"
wandb = "^0.19.1"
hydra-core = "^1.3.2"
pytorch-lightning = "^2.5.0.post0"
frechet-music-distance = "^0.1.0"
mido = "^1.3.3"
muspy = "^0.5.0"
miditok = "^3.0.4"

[tool.poetry.group.dev.dependencies]
ruff = "^0.8.4"
mypy = "^1.14.1"
poethepoet = "^0.32.0"
pytest = "^8.3.4"

[tool.poe.tasks]
ruff = "ruff format src/"
mypy = "mypy src/"
test = "pytest tests/"
train-repr = "python src/scripts/train_repr.py"
train-decoder = "python src/scripts/train_decoder.py"
generate-song = "python src/scripts/generate_song.py"
collect-dataset = "python src/scripts/collect_datasets.py"



[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
