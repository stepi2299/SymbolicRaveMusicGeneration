[tool.poetry]
name = "symbolic_rave"
version = "1.0.0"
description = "Repository for my master thesis with topic: Generating Adaptive Background Music with Explainability Models for Musical Improvisation"
authors = ["stepi2299 <boenisch22@gmail.com>"]
readme = "README.md"
packages = [
    { include = "src" }
]

[[tool.poetry.source]]
name = "pytorch_cu124"
url = "https://download.pytorch.org/whl/cu124"
priority = "explicit"

[tool.poetry.dependencies]
python = "^3.12"
torch = { version = "^2.4.0", source = "pytorch_cu124" }
numpy = "^2.2.1"
wandb = "^0.19.1"
hydra-core = "^1.3.2"
pytorch-lightning = "^2.5.0.post0"
frechet-music-distance = "^0.1.0"
mido = "^1.3.3"
muspy = "^0.5.0"
miditok = "^3.0.4"
transformers = "4.57.*"
scikit-learn = ">=1.3"
matplotlib = ">=3.7"
symusic = "0.5.9"

[tool.poetry.group.dev.dependencies]
ruff = "^0.8.4"
mypy = "^1.14.1"
poethepoet = "^0.32.0"
pytest = "^8.3.4"


[tool.poetry.group.mamba]
optional = true

[tool.poetry.group.mamba.dependencies]
mamba-ssm = "^2.3.0"
causal-conv1d = "^1.6.0"


[tool.poe.tasks]
ruff-lint-check = "ruff check src/"
ruff-format-check= "ruff format --check src/"
ruff-lint = "ruff check --fix-only src/"
ruff-format = "ruff format src/"
ruff-fix = ["ruff-lint", "ruff-format"]
mypy = "mypy src/"
test = "pytest tests/"
train-decoder = "python src/scripts/train_decoder.py"
generate-songs = "python src/scripts/generate_songs.py"
collect-dataset = "python src/scripts/collect_datasets.py"
train-repr = "python src/scripts/train_repr.py"
train-repr-patch = "python src/scripts/train_repr.py adapter=patchilizer model/decoder_wrapper=patch"
train-repr-cp = "python src/scripts/train_repr.py adapter=compound_word loss=cp_elbo model/decoder_wrapper=compound_word"
evaluate-fmd = "python src/scripts/evaluate_fmd.py"

[tool.ruff]
line-length = 120
include = [
    "pyproject.toml", "src/**/*.py"
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "N",  # pep8-naming
    "I",  # isort
    "B",  # flake8-bugbear
    "S",  # flake8-bandit
    "C4", # flake8-comprehensions
    "UP", # pyupgrade,
    "FLY", # flynt,
    "SIM",  # flake8-simplify
    "PL", # pylint
]

[tool.ruff.lint.pylint]
max-args = 8
max-statements=100

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
